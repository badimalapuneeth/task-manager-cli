[project]
name = "task-manager-cli"
version = "0.1.0"
description = "A command-line task management application built using Python"
readme = "README.md"
authors = [
    { name = "Badimala Puneeth", email = "badimalapuneeth@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
task-manager-cli = "task_manager_cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
